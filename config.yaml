# cc_session_mon configuration

# Search paths: roots scanned recursively at startup for nested
# .claude/projects directories (e.g. devcontainer mounts). The local Claude
# projects dir is always watched in addition to these. Supports a leading ~.
search_paths:
  - ~/code

# Theme: mocha (darkest), macchiato, frappe, latte (lightest)
# All themes are from the Catppuccin color palette
theme: frappe

# Burn-rate window: trailing window, in minutes, over which the token burn rate
# (billable tokens/min) is averaged for the tok/m(Nm) column. The window is
# anchored on each session's last action, so idle sessions still report how hard
# they were burning. Omit or set <= 0 to use the default (10 minutes).
#
# The session list also shows a tok/m(1m) column and an "active in the last
# minute" subagent count, both over a fixed 1-minute window that is intentionally
# not configurable — they answer "what is happening right now".
burn_window_minutes: 10

# ============================================================================
# Metric-threshold alerts
# ============================================================================
# Rules evaluated against every session on each 30s UI tick. Each rule names a
# live metric and two thresholds:
#   alert_threshold  -> rings the console bell (BEL) once per crossing, and adds
#                       an entry to the Audit view (press 4). Set <= 0 to disable
#                       this tier for the rule.
#   action_threshold -> when corrective actions are enabled (see below), fires a
#                       corrective action against the session. Set <= 0 to never
#                       act for the rule.
#   action_sustained_ticks -> consecutive over-action-threshold ticks required
#                       before the action fires (1 = first tick; ticks are ~30s).
#
# Available metrics (both decay to 0 when a session goes idle, so an idle
# session never perma-trips):
#   active_subagents   -> subagents active in the last minute
#   tokens_per_min_1m  -> billable tokens/min over the fixed 1-minute window
#
# Replacing this whole `alerts:` list overrides the built-in default. The values
# below are the built-in default (alert at 20 active subagents, act at 40).
# An empty or null `alerts:` disables all alerting.
alerts:
  - metric: active_subagents
    alert_threshold: 20
    action_threshold: 40
    action_sustained_ticks: 1
  # Also alert on a hot recent burn rate (uncomment and calibrate to taste):
  - metric: tokens_per_min_1m
    alert_threshold: 500
    action_threshold: 1200
    action_sustained_ticks: 3

# ============================================================================
# Corrective actions  (DANGEROUS — off by default, opt-in only)
# ============================================================================
# When a session crosses an action_threshold above, "neutralize" it:
#   - local sessions          -> pkill -f <project cwd>  (best-effort SIGTERM)
#   - devcontainer sessions   -> comment the api.anthropic.com allow-rule line in
#                                the proxy filter.py (no auto-rollback)
# Each session is acted on at most once. There is NO undo. Start with
# action_dry_run: true to see what *would* happen (logged to the Audit view)
# before letting it actually run.
enable_corrective_actions: false  # master switch; app is read-only until true
action_dry_run: false             # true = log intended actions without executing

# Devcontainer action settings (only used when a devcontainer session acts):
#   devcontainer_filter_rel_path: proxy filter.py, relative to the .devcontainer dir
#   anthropic_allow_pattern: regex locating the allow-rule line to comment out
devcontainer_filter_rel_path: proxy/filter.py
anthropic_allow_pattern: '(^|[^A-Za-z0-9.-])api\.anthropic\.com($|[^A-Za-z0-9.-])'

# Tool groups define how commands are styled and filtered.
# Groups are checked in order - first match wins.
#
# Each group has:
#   - name: display name for the group
#   - patterns: list of patterns to match (supports * wildcards)
#   - exclude: if true, matching commands are hidden from display entirely
#   - color: catppuccin color name for styling (ignored if exclude is true)
#   - bold: make text bold (optional)
#
# Pattern Format:
#   Bash([sudo:]<command>[:<subcommand>]:*)
#   - sudo is preserved as prefix when present
#   - subcommands are captured for key tools (git, zfs, incus, etc.)
#   - Examples: Bash(sudo:rm:*), Bash(git:push:*), Bash(ls:*)
#
# Security Classification Philosophy:
#   - Groups ordered by decreasing risk/mutation potential
#   - More specific patterns must come BEFORE less specific ones
#   - Red/bold = destructive, privilege escalation, data loss risk
#   - Peach/yellow = filesystem mutations, state changes
#   - Maroon = network access, potential data exfiltration
#   - Mauve = container/VM operations (isolated but powerful)
#   - Blue = build/dev tools (local side effects)
#   - Teal/green = read-only, safe operations
#
# Available catppuccin colors:
#   rosewater, flamingo, pink, mauve, red, maroon, peach, yellow,
#   green, teal, sky, sapphire, blue, lavender, text, subtext1, subtext0,
#   overlay2, overlay1, overlay0, surface2, surface1, surface0, base, mantle, crust

tool_groups:
  # ============================================================================
  # CRITICAL - Destructive operations, privilege escalation, data loss risk
  # Most specific patterns first!
  # ============================================================================
  - name: critical
    color: red
    bold: true
    patterns:
      # ZFS destructive operations (specific subcommands)
      - "Bash(sudo:zfs:destroy:*)"
      - "Bash(sudo:zfs:rollback:*)"
      - "Bash(sudo:zpool:destroy:*)"
      - "Bash(zfs:destroy:*)"
      - "Bash(zfs:rollback:*)"
      - "Bash(zpool:destroy:*)"
      # Git destructive operations (can lose work)
      - "Bash(git:reset:*)"
      - "Bash(git:clean:*)"
      # Destructive file operations with sudo
      - "Bash(sudo:rm:*)"
      - "Bash(sudo:rmdir:*)"
      # Destructive file operations without sudo
      - "Bash(rm:*)"
      - "Bash(rmdir:*)"
      # Disk operations
      - "Bash(sudo:dd:*)"
      - "Bash(sudo:mkfs:*)"
      - "Bash(sudo:fdisk:*)"
      - "Bash(sudo:parted:*)"
      - "Bash(dd:*)"
      - "Bash(mkfs:*)"
      # Process termination
      - "Bash(sudo:kill:*)"
      - "Bash(sudo:pkill:*)"
      - "Bash(sudo:killall:*)"
      - "Bash(kill:*)"
      - "Bash(pkill:*)"
      - "Bash(killall:*)"

  # ============================================================================
  # PRIVILEGED - Sudo commands not caught above (still elevated risk)
  # ============================================================================
  - name: privileged
    color: maroon
    bold: true
    patterns:
      - "Bash(sudo:*)"

  # ============================================================================
  # PERMISSIONS - File permission and ownership changes
  # ============================================================================
  - name: permissions
    color: red
    patterns:
      - "Bash(chmod:*)"
      - "Bash(chown:*)"
      - "Bash(chgrp:*)"
      - "Bash(xattr:*)"

  # ============================================================================
  # FILE WRITE - File creation and overwrites via tool
  # ============================================================================
  - name: file-write
    color: peach
    patterns:
      - Write
      - NotebookEdit

  # ============================================================================
  # FILE EDIT - In-place file modifications via tool
  # ============================================================================
  - name: file-edit
    color: yellow
    patterns:
      - Edit

  # ============================================================================
  # FILESYSTEM MUTATION - Shell commands that change filesystem state
  # ============================================================================
  - name: fs-mutate
    color: peach
    patterns:
      - "Bash(mv:*)"
      - "Bash(cp:*)"
      - "Bash(mkdir:*)"
      - "Bash(touch:*)"
      - "Bash(ln:*)"
      - "Bash(tar:*)"
      - "Bash(unzip:*)"
      - "Bash(gzip:*)"
      - "Bash(gunzip:*)"

  # ============================================================================
  # GIT MUTATION - Git commands that change repository state
  # Note: git:reset and git:clean are in critical section above
  # ============================================================================
  - name: git-mutate
    color: yellow
    patterns:
      - "Bash(git:push:*)"
      - "Bash(git:add:*)"
      - "Bash(git:commit:*)"
      - "Bash(git:merge:*)"
      - "Bash(git:rebase:*)"
      - "Bash(git:cherry-pick:*)"
      - "Bash(git:checkout:*)"
      - "Bash(git:switch:*)"
      - "Bash(git:restore:*)"
      - "Bash(git:stash:*)"
      - "Bash(git:rm:*)"
      - "Bash(git:init:*)"
      - "Bash(git:clone:*)"

  # ============================================================================
  # GIT READ - Safe git operations (read-only)
  # ============================================================================
  - name: git-read
    color: teal
    patterns:
      - "Bash(git:status:*)"
      - "Bash(git:diff:*)"
      - "Bash(git:log:*)"
      - "Bash(git:show:*)"
      - "Bash(git:branch:*)"
      - "Bash(git:fetch:*)"
      - "Bash(git:remote:*)"
      - "Bash(git:describe:*)"
      - "Bash(git:rev-parse:*)"
      - "Bash(git:ls-files:*)"
      - "Bash(git:ls-tree:*)"
      - "Bash(git:*)"  # Catch-all for other git commands

  # ============================================================================
  # NETWORK - Remote access, data transfer, potential exfiltration
  # ============================================================================
  - name: network
    color: flamingo
    patterns:
      - "Bash(ssh:*)"
      - "Bash(scp:*)"
      - "Bash(rsync:*)"
      - "Bash(curl:*)"
      - "Bash(wget:*)"
      - "Bash(nc:*)"
      - "Bash(netcat:*)"
      - "Bash(sftp:*)"
      - "Bash(ftp:*)"
      - WebFetch
      - WebSearch

  # ============================================================================
  # GITHUB - GitHub CLI operations
  # ============================================================================
  - name: github
    color: pink
    patterns:
      - "Bash(gh:pr:*)"
      - "Bash(gh:issue:*)"
      - "Bash(gh:*)"

  # ============================================================================
  # CONTAINER/VM - Virtualization and container management
  # ============================================================================
  - name: container
    color: mauve
    patterns:
      # Incus/LXD
      - "Bash(incus:exec:*)"
      - "Bash(incus:start:*)"
      - "Bash(incus:stop:*)"
      - "Bash(incus:delete:*)"
      - "Bash(incus:*)"
      - "Bash(lxc:*)"
      # Podman/Docker
      - "Bash(podman:*)"
      - "Bash(docker:*)"
      # Kubernetes
      - "Bash(kubectl:delete:*)"
      - "Bash(kubectl:apply:*)"
      - "Bash(kubectl:*)"
      - "Bash(helm:*)"

  # ============================================================================
  # SYSTEM ADMIN - Service and system management
  # ============================================================================
  - name: sysadmin
    color: mauve
    patterns:
      - "Bash(systemctl:start:*)"
      - "Bash(systemctl:stop:*)"
      - "Bash(systemctl:restart:*)"
      - "Bash(systemctl:*)"
      - "Bash(journalctl:*)"
      - "Bash(mount:*)"
      - "Bash(umount:*)"
      - "Bash(findmnt:*)"
      # ZFS read/management (non-destructive - destructive are in critical)
      - "Bash(zfs:list:*)"
      - "Bash(zfs:get:*)"
      - "Bash(zfs:*)"
      - "Bash(zpool:status:*)"
      - "Bash(zpool:list:*)"
      - "Bash(zpool:*)"
      # macOS system
      - "Bash(defaults:write:*)"
      - "Bash(defaults:read:*)"
      - "Bash(defaults:*)"
      - "Bash(plutil:*)"
      - "Bash(codesign:*)"
      - "Bash(networksetup:*)"
      - "Bash(launchctl:*)"

  # ============================================================================
  # NIX - NixOS/Nix package manager
  # ============================================================================
  - name: nix
    color: blue
    patterns:
      - "Bash(nix:build:*)"
      - "Bash(nix:develop:*)"
      - "Bash(nix:flake:*)"
      - "Bash(nix:*)"
      - "Bash(nix-*)"
      - "Bash(nixos-rebuild:switch:*)"
      - "Bash(nixos-rebuild:*)"
      - "Bash(home-manager:*)"

  # ============================================================================
  # BUILD/DEV - Build tools and development commands
  # ============================================================================
  - name: build
    color: blue
    patterns:
      # Build systems
      - "Bash(make:build:*)"
      - "Bash(make:test:*)"
      - "Bash(make:*)"
      - "Bash(cmake:*)"
      - "Bash(cargo:build:*)"
      - "Bash(cargo:test:*)"
      - "Bash(cargo:*)"
      # Go
      - "Bash(go:build:*)"
      - "Bash(go:test:*)"
      - "Bash(go:run:*)"
      - "Bash(go:mod:*)"
      - "Bash(go:get:*)"
      - "Bash(go:install:*)"
      - "Bash(go:*)"
      # Python
      - "Bash(python:*)"
      - "Bash(python3:*)"
      - "Bash(pip:install:*)"
      - "Bash(pip:*)"
      - "Bash(uv:*)"
      - "Bash(pytest:*)"
      - "Bash(alembic:*)"
      # Node
      - "Bash(npm:install:*)"
      - "Bash(npm:run:*)"
      - "Bash(npm:*)"
      - "Bash(yarn:*)"
      - "Bash(pnpm:*)"
      - "Bash(node:*)"
      - "Bash(npx:*)"
      # Package managers
      - "Bash(brew:*)"
      - "Bash(apt:*)"
      - "Bash(apt-get:*)"

  # ============================================================================
  # LINTING - Code quality tools (safe, local analysis)
  # ============================================================================
  - name: lint
    color: sapphire
    patterns:
      - "Bash(ruff:*)"
      - "Bash(mypy:*)"
      - "Bash(pyright:*)"
      - "Bash(eslint:*)"
      - "Bash(prettier:*)"
      - "Bash(golangci-lint:*)"
      - "Bash(pre-commit:*)"
      - "Bash(shellcheck:*)"

  # ============================================================================
  # DATABASE - Database access and queries
  # ============================================================================
  - name: database
    color: sapphire
    patterns:
      - "Bash(sqlite3:*)"
      - "Bash(psql:*)"
      - "Bash(mysql:*)"
      - "Bash(mongosh:*)"
      - "Bash(redis-cli:*)"

  # ============================================================================
  # TMUX - Terminal multiplexer (session management)
  # ============================================================================
  - name: tmux
    color: lavender
    patterns:
      - "Bash(tmux:kill-session:*)"
      - "Bash(tmux:send-keys:*)"
      - "Bash(tmux:new-session:*)"
      - "Bash(tmux:*)"

  # ============================================================================
  # TASK/AGENT - Claude agent spawning and task management
  # ============================================================================
  - name: task
    color: lavender
    patterns:
      - Task
      - TaskOutput
      - TaskCreate
      - TaskUpdate
      - TaskList
      - TaskGet
      - TaskStop
      - Agent

  # ============================================================================
  # SHELL TOOLS - Interactive/helper tools
  # ============================================================================
  - name: shell-tools
    color: lavender
    patterns:
      - "Bash(bd:*)"
      - "Bash(claude:*)"
      - "Bash(expect:*)"
      - "Bash(script:*)"

  # ============================================================================
  # PROCESS INFO - Process and system inspection (read-only)
  # ============================================================================
  - name: process-info
    color: sky
    patterns:
      - "Bash(ps:*)"
      - "Bash(top:*)"
      - "Bash(htop:*)"
      - "Bash(lsof:*)"
      - "Bash(pgrep:*)"
      - "Bash(fuser:*)"
      - "Bash(pidstat:*)"
      - "Bash(vmstat:*)"
      - "Bash(iotop:*)"
      - "Bash(free:*)"
      - "Bash(uptime:*)"
      - "Bash(who:*)"
      - "Bash(whoami:*)"

  # ============================================================================
  # SYSTEM INFO - System inspection commands (read-only)
  # ============================================================================
  - name: system-info
    color: sky
    patterns:
      - "Bash(uname:*)"
      - "Bash(hostname:*)"
      - "Bash(df:*)"
      - "Bash(du:*)"
      - "Bash(lsblk:*)"
      - "Bash(blkid:*)"
      - "Bash(lshw:*)"
      - "Bash(dmidecode:*)"
      - "Bash(ifconfig:*)"
      - "Bash(ip:*)"
      - "Bash(netstat:*)"
      - "Bash(ss:*)"
      - "Bash(env:*)"
      - "Bash(printenv:*)"
      - "Bash(date:*)"
      - "Bash(arch:*)"

  # ============================================================================
  # FILE READ - File inspection commands (read-only)
  # ============================================================================
  - name: file-read
    color: green
    patterns:
      - "Bash(ls:*)"
      - "Bash(cat:*)"
      - "Bash(head:*)"
      - "Bash(tail:*)"
      - "Bash(less:*)"
      - "Bash(more:*)"
      - "Bash(file:*)"
      - "Bash(stat:*)"
      - "Bash(wc:*)"
      - "Bash(md5:*)"
      - "Bash(sha256sum:*)"
      - "Bash(xxd:*)"
      - "Bash(od:*)"

  # ============================================================================
  # SEARCH - File and content search (read-only)
  # ============================================================================
  - name: search
    color: green
    patterns:
      - "Bash(find:*)"
      - "Bash(grep:*)"
      - "Bash(rg:*)"
      - "Bash(ag:*)"
      - "Bash(fd:*)"
      - "Bash(locate:*)"
      - "Bash(mdfind:*)"
      - "Bash(which:*)"
      - "Bash(type:*)"
      - "Bash(whereis:*)"

  # ============================================================================
  # READ-ONLY TOOLS - Claude's read-only tools
  # ============================================================================
  - name: read-only
    color: green
    patterns:
      - Read
      - Glob
      - Grep
      - LSP
      - TodoRead
      - TodoWrite
      - AskUserQuestion
      - ExitPlanMode
      - EnterPlanMode
      - Skill
      - KillShell
      - ToolSearch

  # ============================================================================
  # MCP - Model Context Protocol tools
  # ============================================================================
  - name: mcp
    color: sky
    patterns:
      - "mcp__*"

  # ============================================================================
  # MISC BASH - Other bash commands not categorized
  # ============================================================================
  - name: bash-other
    color: overlay2
    patterns:
      - "Bash(*)"

  # ============================================================================
  # CATCH-ALL - Anything not matched above
  # ============================================================================
  - name: unmatched
    color: overlay1
    patterns:
      - "*"
